<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="study" id="study" class="contents" hx-target="#study" hx-swap="outerHTML" hx-include="#studyForm">
    <form id="studyForm" class="contents">
        <input type="hidden" name="deckId" th:value="${deckId}">
        <input type="hidden" name="order" th:value="${order}">
        <input type="hidden" name="queue" th:value="${queueParam}">
        <input type="hidden" name="index" th:value="${index}">

        <section class="card break-words">
            <h3 class="mb-1 text-xs font-semibold uppercase tracking-wider text-muted">Question</h3>
            <p class="mb-5 text-lg leading-relaxed"
               th:if="${hasDeck and mode != 'add' and mode != 'edit'}"
               th:text="${currentFlashcard != null ? currentFlashcard.question : 'No flashcards. Add one below.'}"></p>
            <p class="mb-5 text-lg leading-relaxed" th:unless="${hasDeck}">No decks yet. Create one above to get started.</p>
            <input th:if="${hasDeck and (mode == 'add' or mode == 'edit')}" type="text" name="question" th:value="${formQuestion}"
                   class="field-input mb-2 w-full">
            <p class="-mt-3 mb-3 text-sm text-danger" th:if="${errors != null and errors.question != null}" th:text="${errors.question}"></p>

            <h3 class="mb-1 text-xs font-semibold uppercase tracking-wider text-muted">Answer</h3>
            <details th:if="${hasDeck and mode == 'view' and currentFlashcard != null}">
                <summary class="btn btn-primary mb-4">Reveal Answer</summary>
                <p class="mb-4 text-lg leading-relaxed" th:text="${currentFlashcard.answer}"></p>
                <div class="flex w-[90%] max-w-xs flex-nowrap gap-2.5">
                    <button type="button" id="unknownButton" class="btn btn-danger"
                            th:attr="hx-post=@{/flashcards/{id}/review(id=${currentFlashcard.id})}"
                            hx-vals="{&quot;status&quot;:&quot;UNKNOWN&quot;}">Still Learning</button>
                    <button type="button" id="knownButton" class="btn btn-success"
                            th:attr="hx-post=@{/flashcards/{id}/review(id=${currentFlashcard.id})}"
                            hx-vals="{&quot;status&quot;:&quot;KNOWN&quot;}">I Knew It</button>
                </div>
            </details>
            <p th:if="${hasDeck and mode == 'view' and currentFlashcard == null}"></p>
            <input th:if="${hasDeck and (mode == 'add' or mode == 'edit')}" type="text" name="answer" th:value="${formAnswer}"
                   class="field-input w-full">
            <p class="mt-1 text-sm text-danger" th:if="${errors != null and errors.answer != null}" th:text="${errors.answer}"></p>
        </section>

        <p class="text-sm text-muted" th:if="${hasDeck and !flashcards.isEmpty()}"
           th:text="'Card ' + (${index} + 1) + ' of ' + ${flashcards.size()} + ' · ' + ${knownCount} + ' known'"></p>

        <div class="flex w-[90%] max-w-[260px] flex-nowrap justify-between gap-2" th:if="${hasDeck and mode == 'view'}">
            <button type="button" id="prevButton" class="btn" th:disabled="${index <= 0}" hx-get="/flashcards/study/previous">Previous</button>
            <button type="button" id="nextButton" class="btn" th:disabled="${flashcards.isEmpty() or index >= flashcards.size() - 1}" hx-get="/flashcards/study/next">Next</button>
        </div>

        <div class="flex w-[90%] max-w-[500px] flex-wrap justify-center gap-2.5" th:if="${hasDeck}">
            <button type="button" id="addFlashcard" class="btn" th:if="${mode == 'view'}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;add&quot;}">Add Flashcard</button>
            <button type="button" id="editFlashcard" class="btn" th:if="${mode == 'view' and currentFlashcard != null}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;edit&quot;}">Edit Flashcard</button>
            <button type="button" id="deleteFlashcard" class="btn btn-danger" th:if="${mode == 'view' and currentFlashcard != null}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;delete&quot;}">Delete Flashcard</button>

            <button type="button" id="add" class="btn btn-primary" th:if="${mode == 'add'}" hx-post="/flashcards/study/create">Add</button>
            <button type="button" id="edit" class="btn btn-primary" th:if="${mode == 'edit'}"
                    th:attr="hx-post=@{/flashcards/{id}/edit(id=${currentFlashcard.id})}">Edit</button>
            <button type="button" id="delete" class="btn btn-danger" th:if="${mode == 'delete'}"
                    th:attr="hx-delete=@{/flashcards/{id}(id=${currentFlashcard.id})}">Delete</button>
            <button type="button" id="undo" class="btn" th:if="${mode != 'view'}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;view&quot;}">Undo</button>
        </div>
    </form>
</div>
</body>
</html>
