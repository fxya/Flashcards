<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="study" id="study" class="contents" hx-target="#study" hx-swap="outerHTML" hx-include="#studyForm">
    <form id="studyForm" class="contents">
        <input type="hidden" name="deckId" th:value="${deckId}">
        <input type="hidden" name="order" th:value="${order}">
        <input type="hidden" name="search" th:value="${search}">
        <input type="hidden" name="queue" th:value="${queueParam}">
        <input type="hidden" name="index" th:value="${index}">

        <section class="card w-full">
            <p class="eyebrow">Question</p>

            <p class="question-text" th:if="${hasDeck and mode != 'add' and mode != 'edit' and currentFlashcard != null}"
               th:text="${currentFlashcard.question}"></p>
            <p class="question-text text-muted" th:if="${hasDeck and mode == 'view' and currentFlashcard == null and (search == null or search.isBlank())}">
                No flashcards yet. Add one below.</p>
            <p class="question-text text-muted" th:if="${hasDeck and mode == 'view' and currentFlashcard == null and search != null and !search.isBlank()}"
               th:text="'No cards match &quot;' + ${search} + '&quot;.'"></p>
            <p class="question-text text-muted" th:unless="${hasDeck}">No decks yet. Open the menu above to create one.</p>

            <input th:if="${hasDeck and (mode == 'add' or mode == 'edit')}" type="text" name="question" th:value="${formQuestion}"
                   placeholder="Question" class="field-input mb-1 w-full text-lg">
            <p class="mb-1 text-sm text-danger" th:if="${errors != null and errors.question != null}" th:text="${errors.question}"></p>

            <div th:if="${hasDeck and mode == 'view' and currentFlashcard != null}">
                <details class="reveal">
                    <summary class="btn btn-primary btn-lg mt-4">Reveal answer</summary>
                    <p class="eyebrow mt-4">Answer</p>
                    <p class="answer-text" th:text="${currentFlashcard.answer}"></p>
                    <div class="review-actions">
                        <button type="button" id="unknownButton" class="btn btn-danger"
                                th:attr="hx-post=@{/flashcards/{id}/review(id=${currentFlashcard.id})}"
                                hx-vals="{&quot;status&quot;:&quot;UNKNOWN&quot;}">Still learning</button>
                        <button type="button" id="knownButton" class="btn btn-success"
                                th:attr="hx-post=@{/flashcards/{id}/review(id=${currentFlashcard.id})}"
                                hx-vals="{&quot;status&quot;:&quot;KNOWN&quot;}">I knew it</button>
                    </div>
                </details>
            </div>

            <div th:if="${hasDeck and mode == 'delete'}" class="mt-4">
                <p class="eyebrow">Answer</p>
                <p class="answer-text" th:text="${currentFlashcard.answer}"></p>
                <p class="mt-4 text-sm text-danger">Delete this card? This cannot be undone.</p>
            </div>

            <input th:if="${hasDeck and (mode == 'add' or mode == 'edit')}" type="text" name="answer" th:value="${formAnswer}"
                   placeholder="Answer" class="field-input w-full text-lg">
            <p class="mt-1 text-sm text-danger" th:if="${errors != null and errors.answer != null}" th:text="${errors.answer}"></p>
        </section>

        <div class="nav-row" th:if="${hasDeck and mode == 'view'}">
            <button type="button" id="prevButton" class="icon-btn" aria-label="Previous card"
                    th:disabled="${index <= 0}" hx-get="/flashcards/study/previous">
                <svg class="icon h-5 w-5" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"></path></svg>
            </button>
            <p class="progress-text" th:if="${!flashcards.isEmpty()}"
               th:text="'Card ' + (${index} + 1) + ' of ' + ${flashcards.size()} + ' · ' + ${knownCount} + ' known'"></p>
            <button type="button" id="nextButton" class="icon-btn" aria-label="Next card"
                    th:disabled="${flashcards.isEmpty() or index >= flashcards.size() - 1}" hx-get="/flashcards/study/next">
                <svg class="icon h-5 w-5" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"></path></svg>
            </button>
        </div>

        <div class="card-actions" th:if="${hasDeck and mode == 'view'}">
            <button type="button" id="addFlashcard" class="icon-text-btn"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;add&quot;}">
                <svg class="icon h-4 w-4" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                Add
            </button>
            <button type="button" id="editFlashcard" class="icon-text-btn" th:if="${currentFlashcard != null}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;edit&quot;}">
                <svg class="icon h-4 w-4" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20z"></path><path d="M13.5 6.5l4 4"></path></svg>
                Edit
            </button>
            <button type="button" id="deleteFlashcard" class="icon-text-btn text-danger" th:if="${currentFlashcard != null}"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;delete&quot;}">
                <svg class="icon h-4 w-4" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M7 7l1 12a1 1 0 001 1h6a1 1 0 001-1l1-12"></path></svg>
                Delete
            </button>
        </div>

        <div class="card-actions" th:if="${mode != 'view'}">
            <button type="button" id="add" class="btn btn-primary" th:if="${mode == 'add'}" hx-post="/flashcards/study/create">Add card</button>
            <button type="button" id="edit" class="btn btn-primary" th:if="${mode == 'edit'}"
                    th:attr="hx-post=@{/flashcards/{id}/edit(id=${currentFlashcard.id})}">Save changes</button>
            <button type="button" id="delete" class="btn btn-danger" th:if="${mode == 'delete'}"
                    th:attr="hx-delete=@{/flashcards/{id}(id=${currentFlashcard.id})}">Confirm delete</button>
            <button type="button" id="undo" class="btn"
                    hx-get="/flashcards/study/mode" hx-vals="{&quot;mode&quot;:&quot;view&quot;}">Cancel</button>
        </div>
    </form>
</div>
</body>
</html>
