<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
    <main class="container">
        <section class="flashcard">
            <h3>Question</h3>
            <p id="question">Loading...</p>
            <h3>Answer</h3>
            <p id="answer" class="hidden">Loading...</p>
        </section>
        <div id="navbuttoncontainer" class="navbuttoncontainer">
            <button id="prevButton" type="button">Previous</button>
            <button id="revealButton" type="button">Reveal Answer</button>
            <button id="nextButton" type="button">Next</button>
        </div>
        <div class="buttoncontainer">
            <button id="addFlashcard" type="button">Add Flashcard</button>
            <button id="editFlashcard" type="button">Edit Flashcard</button>
            <button id="deleteFlashcard" type="button">Delete Flashcard</button>
            <button id="add" type="button" class="hidden">Add</button>
            <button id="edit" type="button" class="hidden">Edit</button>
            <button id="delete" type="button" class="hidden">Delete</button>
            <button id="undo" type="button" class="hidden">Undo</button>
        </div>
    </main>
    <script type="module" src="/flashcards.js"></script>
</body>
</html>
