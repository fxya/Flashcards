plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '7.4.1.Final'
    id 'org.graalvm.buildtools.native' version '1.1.9'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mockito:mockito-core'
}

test {
    useJUnitPlatform()
    dependsOn 'cleanTest'
}

// Tailwind CSS is compiled with the standalone CLI (no Node/npm toolchain) and the
// output is committed like any other static asset - these tasks are a dev
// convenience for regenerating it after editing src/main/tailwind/input.css or the
// Thymeleaf templates, not a dependency of the default build/CI.
def tailwindCliVersion = '4.3.3'
def tailwindCli = layout.buildDirectory.file("tailwind-cli/tailwindcss-linux-x64")

tasks.register('downloadTailwindCli') {
    outputs.file(tailwindCli)
    doLast {
        def file = tailwindCli.get().asFile
        if (!file.exists()) {
            file.parentFile.mkdirs()
            def url = "https://github.com/tailwindlabs/tailwindcss/releases/download/v${tailwindCliVersion}/tailwindcss-linux-x64"
            logger.lifecycle("Downloading Tailwind CLI ${tailwindCliVersion} from ${url}")
            new URL(url).withInputStream { input -> file.withOutputStream { it << input } }
            file.setExecutable(true)
        }
    }
}

tasks.register('tailwindBuild', Exec) {
    description = 'Compiles src/main/tailwind/input.css to src/main/resources/static/styles.css (Linux x64 only; ' +
            'on another platform, download the matching standalone CLI from ' +
            'https://github.com/tailwindlabs/tailwindcss/releases and run it with the same -i/-o arguments).'
    dependsOn tasks.named('downloadTailwindCli')
    inputs.file('src/main/tailwind/input.css')
    inputs.dir('src/main/resources/templates')
    outputs.file('src/main/resources/static/styles.css')
    commandLine tailwindCli.get().asFile, '-i', 'src/main/tailwind/input.css',
            '-o', 'src/main/resources/static/styles.css', '--minify'
}